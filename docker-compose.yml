# 单色海报 agent 网关 — 双容器编排（调研报告 §4 架构）：
#   dsh     = DSH + dsh-webapi 插件 + mono-color 技能 + MCP 图像服务
#   gateway = 网关进程 + 前端静态产物（公网入口，8080）
# 密钥从项目根 .env 读取（见 .env.example 同名变量）。
services:
  dsh:
    build:
      context: .
      dockerfile: docker/dsh/Dockerfile
    image: mono-poster-dsh:latest
    container_name: dsh
    ports:
      # dsh-webapi 的 REST/SSE 挂在 dsh web 宿主端口的 /api/v1 下
      - "3080:3080"
    environment:
      # 网关 → DSH 的数据面鉴权（dsh-web-service 配置 apiKey，非空即强制开启）
      DSH_WEB_API_KEY: ${DSH_WEB_API_KEY:?在 .env 中设置 DSH_WEB_API_KEY}
      # 路由模型凭据：DSH DeepSeek adapter 按 apiKeyEnv 读取
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?在 .env 中设置 DEEPSEEK_API_KEY}
      # MCP 图像服务（ADR-0003：DSH 内经 MCP 调 APIMart gpt-image-2）
      APIMART_API_KEY: ${APIMART_API_KEY:?在 .env 中设置 APIMART_API_KEY}
      APIMART_BASE_URL: ${APIMART_BASE_URL:-https://api.apimart.ai/v1}
      APIMART_IMAGE_MODEL: ${APIMART_IMAGE_MODEL:-gpt-image-2}
    volumes:
      # 会话、附件、插件 profile 状态；首次启动从镜像继承 skills 与 profile
      - dsh-home:/root/.dsh
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: mono-poster-gateway:latest
    container_name: gateway
    ports:
      # 公网入口：HTTP + WS（/ws 升级）与前端静态页
      - "8080:8080"
      # 签发页/管理 API：仅宿主回环，供 nginx /admin（Basic Auth）反代
      - "127.0.0.1:8081:8081"
    environment:
      # 仅容器内网可达；DSH_WEB_API_KEY 只存在于 dsh 与 gateway 两侧
      DSH_BASE_URL: http://dsh:3080/api/v1
      DSH_WEB_API_KEY: ${DSH_WEB_API_KEY:?在 .env 中设置 DSH_WEB_API_KEY}
      # 前端构建产物由网关托管（docker/gateway/Dockerfile 已内置）
      STATIC_DIR: /app/frontend/dist
      # admin 绑全网卡容器口；宿主仅 127.0.0.1:8081 发布（nginx /admin + auth 暴露）
      GATEWAY_ADMIN_HOST: 0.0.0.0
    depends_on:
      - dsh
    restart: unless-stopped

volumes:
  dsh-home:
