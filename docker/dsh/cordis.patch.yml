# 用户层配置补丁（profile web）：作用于所有 bundle 层之后。
# 语法依据：dsh --profile web --dump-config-schema 的 patch 条目定义。

# dsh-web-api 插件：配置整体替换（config 不做深合并），未写字段回落 schema 默认值。
- id: dsh-web-service
  config:
    # 非空即强制开启数据面鉴权；网关以 Authorization: Bearer <key> 调用
    apiKey: !!js process.env.DSH_WEB_API_KEY || ''
    cors: true

# 注册 APIMart 图像 MCP 服务（stdio）。工具名：mcp__image__generate_image
# 注意：stdio 子进程环境会剥离 KEY/TOKEN 类环境变量，须在此显式透传。
- insert:
    - id: mcp-image
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: image
        transport: stdio
        command: node
        args: ['/opt/mcp-image/server.mjs']
        # 生图为异步轮询，可能超过默认 60s
        toolCallTimeoutMs: 300000
        env:
          APIMART_API_KEY: !!js process.env.APIMART_API_KEY || ''
          APIMART_BASE_URL: !!js process.env.APIMART_BASE_URL || 'https://api.apimart.ai/v1'
          APIMART_IMAGE_MODEL: !!js process.env.APIMART_IMAGE_MODEL || 'gpt-image-2'
